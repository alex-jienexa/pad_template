schema_version: "1.0"
required_front_matter:
  - id
  - title
  - status
  - priority
  - created_at
  - updated_at
fields:
  id: "^[A-Z][A-Z0-9]*-[0-9]{3,}$"
  status: [backlog, ready, in_progress, review, blocked, done, cancelled]
  priority: [critical, high, medium, low]
  assignee: string
  depends_on: list[string]
  requirement_ids: list[string]
  labels: list[string]
  estimate: string_or_null
  due_date: date_or_null
  parent: task_id_or_null
  files_owned: list[string]
